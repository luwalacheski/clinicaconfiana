<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Confiança | Odontologia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --primary: #0ea5e9; --text: #334155; --white: #ffffff; --success: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8fafc; color: var(--text); }

        header { background: var(--white); padding: 1.5rem 10%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .logo { font-size: 1.5rem; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        nav button { background: none; border: none; padding: 0.5rem 1rem; cursor: pointer; font-weight: 500; color: var(--text); transition: 0.3s; }
        nav button.active { color: var(--primary); border-bottom: 2px solid var(--primary); }

        main { max-width: 800px; margin: 3rem auto; padding: 0 20px; }
        .card { background: var(--white); padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 1.5rem; color: #1e293b; text-align: center; }

        .form-group { margin-bottom: 1rem; }
        input, select { width: 100%; padding: 0.8rem; border: 1px solid #e2e8f0; border-radius: 10px; }
        button.btn-submit { width: 100%; background: var(--success); color: white; padding: 1rem; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 1rem; }
        
        .contact-item { display: flex; align-items: center; gap: 10px; margin: 15px 0; justify-content: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; border-bottom: 1px solid #e2e8f0; text-align: left; }
    </style>
</head>
<body>

<header>
    <div class="logo"><i data-lucide="smile"></i> Sorriso Perfeito</div>
    <nav>
        <button id="btnClient" class="active" onclick="switchView('client')">Agendar</button>
        <button id="btnContact" onclick="switchView('contact')">Contato</button>
        <button id="btnAdmin" onclick="switchView('admin')">Painel</button>
    </nav>
</header>

<main>
    <!-- Agendamento -->
    <section id="clientView" class="view">
        <div class="card">
            <h2>Agende sua consulta</h2>
            <form id="appointmentForm" onsubmit="saveAppointment(event)">
                <div class="form-group"><input type="text" id="clientName" placeholder="Nome Completo" required></div>
                <div class="form-group"><input type="tel" id="clientPhone" placeholder="Telefone" required></div>
                <div class="form-group"><select id="procedure"><option>Limpeza</option><option>Clareamento</option><option>Avaliação</option></select></div>
                <div class="form-group"><input type="date" id="appointmentDate" required></div>
                <button type="submit" class="btn-submit">Confirmar Agendamento</button>
            </form>
        </div>
    </section>

    <!-- Contato -->
    <section id="contactView" class="view" style="display:none;">
        <div class="card">
            <h2>Fale Conosco</h2>
            <div class="contact-item"><i data-lucide="map-pin"></i> Rua Odonto, 123 - Centro</div>
            <div class="contact-item"><i data-lucide="phone"></i> (41) 99999-9999</div>
            <div class="contact-item"><i data-lucide="mail"></i> contato@sorrisoperfeito.com</div>
        </div>
    </section>

    <!-- Painel Admin -->
    <section id="adminView" class="view" style="display:none;">
        <div class="card">
            <h2>Painel de Gestão</h2>
            <table id="adminTable">
                <thead><tr><th>Paciente</th><th>Procedimento</th><th>Data</th></tr></thead>
                <tbody id="appointmentTableBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
    lucide.createIcons();

    function switchView(view) {
        if(view === 'admin') {
            const pass = prompt("Senha do Gestor:");
            if(pass !== "1234") return alert("Acesso negado");
            loadAppointments();
        }
        document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
        document.getElementById(view + 'View').style.display = 'block';
    }

    function saveAppointment(e) {
        e.preventDefault();
        const app = {
            name: document.getElementById('clientName').value,
            proc: document.getElementById('procedure').value,
            date: document.getElementById('appointmentDate').value
        };
        let list = JSON.parse(localStorage.getItem('apps') || '[]');
        list.push(app);
        localStorage.setItem('apps', JSON.stringify(list));
        alert("Agendado com sucesso!");
        e.target.reset();
    }

    function loadAppointments() {
        const list = JSON.parse(localStorage.getItem('apps') || '[]');
        const body = document.getElementById('appointmentTableBody');
        body.innerHTML = list.map(a => `<tr><td>${a.name}</td><td>${a.proc}</td><td>${a.date}</td></tr>`).join('');
    }
</script>
</body>
</html>
