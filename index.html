<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorriso Perfeito | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --primary: #0ea5e9; --text: #334155; --white: #ffffff; --success: #22c55e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8fafc; color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-container { background: var(--white); padding: 3rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h1 { color: var(--primary); margin-bottom: 2rem; }
        
        .btn-login { width: 100%; padding: 1rem; margin-top: 1rem; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-paciente { background: var(--primary); color: white; }
        .btn-gestor { background: #e2e8f0; color: var(--text); }
        .btn-login:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Esconder tudo inicialmente */
        .view { display: none; }
        header { background: var(--white); padding: 1.5rem 10%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; position: absolute; top: 0; }
        .card { background: var(--white); padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); margin-top: 5rem; width: 100%; max-width: 600px; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN (Início) -->
<div id="loginScreen" class="login-container">
    <h1>Bem-vindo(a)</h1>
    <p>Como deseja acessar o sistema?</p>
    <button class="btn-login btn-paciente" onclick="enterAs('client')">Entrar como Paciente</button>
    <button class="btn-login btn-gestor" onclick="enterAs('admin')">Painel Funcionário/Gestor</button>
</div>

<!-- SISTEMA (Escondido até o login) -->
<div id="appContainer" style="display:none; width: 100%; display: flex; flex-direction: column; align-items: center;">
    <header>
        <div class="logo">Sorriso Perfeito</div>
        <nav><button onclick="location.reload()">Sair</button></nav>
    </header>

    <main style="width: 90%; max-width: 600px;">
        <!-- Agendamento -->
        <section id="clientView" class="view">
            <div class="card">
                <h2>Agende sua consulta</h2>
                <form onsubmit="saveAppointment(event)">
                    <input type="text" id="name" placeholder="Nome" required style="width:100%; padding:10px; margin-bottom:10px;">
                    <input type="date" id="date" required style="width:100%; padding:10px; margin-bottom:10px;">
                    <button type="submit" style="width:100%; padding:10px; background:var(--success); color:white; border:none; border-radius:5px;">Confirmar</button>
                </form>
            </div>
        </section>

        <!-- Admin -->
        <section id="adminView" class="view">
            <div class="card">
                <h2>Painel do Gestor</h2>
                <table id="adminTable" style="width:100%; text-align:left;">
                    <tbody id="adminBody"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
    function enterAs(role) {
        if (role === 'admin') {
            const pass = prompt("Digite a senha do funcionário:");
            if (pass !== "1234") return alert("Senha incorreta!");
            document.getElementById('adminView').style.display = 'block';
        } else {
            document.getElementById('clientView').style.display = 'block';
        }
        
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';
        if(role === 'admin') loadApps();
    }

    function saveAppointment(e) {
        e.preventDefault();
        const app = { name: document.getElementById('name').value, date: document.getElementById('date').value };
        let list = JSON.parse(localStorage.getItem('apps') || '[]');
        list.push(app);
        localStorage.setItem('apps', JSON.stringify(list));
        alert("Agendado!");
        e.target.reset();
    }

    function loadApps() {
        const list = JSON.parse(localStorage.getItem('apps') || '[]');
        document.getElementById('adminBody').innerHTML = list.map(a => `<tr><td>${a.name}</td><td>${a.date}</td></tr>`).join('');
    }
</script>
</body>
</html>
